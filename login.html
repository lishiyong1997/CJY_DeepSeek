<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>用户登录 · 国家国防科技工业软件产教研平台</title>
<meta name="description" content="国家国防科技工业软件产教研平台用户登录入口。" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="auth-body">

<div class="auth-shell noise">
  <div class="auth-shell__bg"></div>
  <canvas id="authFlow" class="auth-shell__flow"></canvas>

  <!-- 左侧 · 玻璃登录表单 -->
  <div class="auth-panel">
    <div class="auth-card">
      <div class="auth-card__brand">
        <span class="brand__emblem">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
            <path d="M12 2.5l2.6 2.1 3.3-.4 1.5 3 2.7 1.9-.7 3.2 2 2.6-2 2.6.7 3.2-2.7 1.9-1.5 3-3.3-.4L12 27l-2.6-2.1-3.3.4-1.5-3-2.7-1.9.7-3.2-2-2.6 2-2.6-.7-3.2 2.7-1.9 1.5-3 3.3.4z" transform="scale(0.72) translate(4.7 0)"/>
            <path d="M12 9.5l.9 1.8 2 .3-1.45 1.4.34 2L12 14l-1.8.95.35-2L9.1 11.6l2-.3z"/>
          </svg>
        </span>
        <div>
          <b>国家国防科技工业软件产教研平台</b>
          <span>NATIONAL PLATFORM · 统一身份认证</span>
        </div>
      </div>

      <h1>欢迎登录</h1>
      <p>军工单位 · 软件厂商 · 高等院校 统一身份入口</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginUser">用户名</label>
          <input type="text" id="loginUser" placeholder="请输入用户名 / 手机号" />
        </div>
        <div class="field">
          <label for="loginPass">密码</label>
          <input type="password" id="loginPass" placeholder="请输入登录密码" />
        </div>
        <div class="field field--row">
          <label style="display:flex;align-items:center;gap:7px;cursor:pointer">
            <input type="checkbox" style="width:15px;height:15px;accent-color:#0e7ad6" /> 记住登录状态
          </label>
          <a href="javascript:void(0)">忘记密码？</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn--primary">登 录</button>
      </form>

      <div class="auth-alt">尚未注册账号？<a href="javascript:void(0)">立即注册</a></div>
    </div>
  </div>

  <!-- 右侧 · 立体 3D 智能工业控制中枢 -->
  <div class="auth-visual">
    <canvas id="authVisual" class="auth-visual__canvas"></canvas>
    <div class="auth-visual__caption">智能工业控制中枢 · AI 工业软件底座</div>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
